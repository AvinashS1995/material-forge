<div class="confirm-dialog">
  <div class="confirm-dialog__header">
    <mat-icon [class]="iconClass">{{ icon }}</mat-icon>
    <h2 mat-dialog-title class="confirm-dialog__title">{{ data.title }}</h2>
  </div>

  <mat-dialog-content class="confirm-dialog__content">
    <p>{{ data.message }}</p>
  </mat-dialog-content>

  <mat-dialog-actions class="confirm-dialog__actions" align="end">
    <button mat-stroked-button (click)="cancel()" type="button">
      {{ data.cancelText ?? 'Cancel' }}
    </button>
    <button
      mat-flat-button
      [color]="data.type === 'danger' ? 'warn' : 'primary'"
      (click)="confirm()"
      type="button"
      cdkFocusInitial>
      {{ data.confirmText ?? 'Confirm' }}
    </button>
  </mat-dialog-actions>
</div>
